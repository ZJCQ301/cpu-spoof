name: Build Zygisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Setup NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip -q android-ndk-r26d-linux.zip
        echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV

    - name: Build ARM64
      run: |
        mkdir -p module/zygisk
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ \
          -std=c++20 -fPIC -shared -O2 \
          -I$GITHUB_WORKSPACE/zygisk \
          -o module/zygisk/arm64-v8a.so \
          jni/main.cpp

    - name: Build ARMv7
      run: |
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang++ \
          -std=c++20 -fPIC -shared -O2 \
          -I$GITHUB_WORKSPACE/zygisk \
          -o module/zygisk/armeabi-v7a.so \
          jni/main.cpp

    - name: Prepare module files
      run: |
        cat > module/module.prop << 'EOF'
id=cpu_spoof
name=Zygisk CPU Spoof
version=1.0
versionCode=1
author=ZJCQ301
description=Process-level CPU spoofer for games
minMagisk=24000
zygisk=true
EOF
        cat > module/customize.sh << 'EOF'
#!/sbin/sh
MODDIR=${0%/*}
[ "$ZYGISK_ENABLED" ] && exit 0
mkdir -p "$MODDIR/zygisk"
cp -f "$MODDIR/arm64-v8a.so" "$MODDIR/zygisk/"
cp -f "$MODDIR/armeabi-v7a.so" "$MODDIR/zygisk/"
EOF
        chmod +x module/customize.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-cpu-spoof
        path: module/
